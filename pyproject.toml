[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "acu-desktop"
version = "0.1.0"
description = "Run AutoHotkey v2 script files through the acu CLI"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
acu = "acu.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "Pillow>=11",
    "tiktoken>=0.12",
    "pywin32>=306 ; sys_platform == 'win32'",
]

[tool.hatch.build.targets.wheel]
packages = ["acu"]

[tool.hatch.build.targets.sdist]
only-include = ["acu", "retro-acu", "README.md", "pyproject.toml", "uv.lock", "install_skill.py", "CONTEXT.md", "docs/adr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "desktop: runs AutoHotkey or interacts with the Windows desktop; requires --desktop",
]
